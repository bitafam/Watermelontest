// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        exclude group: 'com.adcolony'
    }
}

subprojects { project ->
    afterEvaluate {
        if (project.name == 'capacitor-cordova-android-plugins') {
            project.android {
                buildFeatures {
                    aidl = true
                }
                sourceSets {
                    main {
                        aidl.srcDirs = ['src/main/java', 'src/main/aidl']
                    }
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

// Copy the billing AIDL file if it exists, so the plugins compile successfully
def aidlSrc = file("../node_modules/cordova-plugin-android-iab/src/android/com/android/vending/billing/IInAppBillingService.aidl")
if (aidlSrc.exists()) {
    def aidlDestDir = file("capacitor-cordova-android-plugins/src/main/aidl/com/android/vending/billing")
    aidlDestDir.mkdirs()
    def aidlDestFile = file("capacitor-cordova-android-plugins/src/main/aidl/com/android/vending/billing/IInAppBillingService.aidl")
    if (!aidlDestFile.exists() || aidlDestFile.length() != aidlSrc.length()) {
        aidlDestFile.bytes = aidlSrc.bytes
        println "SUCCESS: Copied IInAppBillingService.aidl to plugin project"
    }
} else {
    println "WARNING: cordova-plugin-android-iab AIDL not found in node_modules"
}

