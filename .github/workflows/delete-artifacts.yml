name: Delete All Artifacts

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  delete:
    runs-on: ubuntu-latest

    steps:
      - name: Delete all artifacts
        run: |
          gh api --paginate \
            "/repos/${{ github.repository }}/actions/artifacts" \
            --jq '.artifacts[].id' | \
          xargs -I {} gh api \
            --method DELETE \
            "/repos/${{ github.repository }}/actions/artifacts/{}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
